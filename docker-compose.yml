services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: ku
      POSTGRES_PASSWORD: ku
      POSTGRES_DB: ku
    ports:
      - "5433:5432"

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ku
      MYSQL_USER: ku
      MYSQL_PASSWORD: ku
      MYSQL_DATABASE: ku
    ports:
      - "3307:3306"
